name: TestFlight ops

# Read or fix TestFlight distribution for Saguaro Field (net.saguarocontrol.field)
# through the App Store Connect API, using the same ASC_* secrets as ios.yml.
#   status      read-only: builds, beta states, groups, review state
#   distribute  newest valid build → export compliance, What to Test, every
#               beta group, Beta App Review submission for external testers
# Runs on an Ubuntu runner (no Mac minutes). On the ops/testflight branch a push
# runs the mode written in tools/asc-mode.txt.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'status or distribute'
        type: choice
        options: [status, distribute]
        default: status
  push:
    branches: [ops/testflight]
    paths: ['tools/asc.mjs', 'tools/asc-screens.mjs', 'tools/asc-mode.txt', 'tools/e2e-login.mjs', '.github/workflows/testflight-ops.yml']

# write: screens-capture commits the screenshots it takes back to this branch.
permissions:
  contents: write
  statuses: read

concurrency:
  group: testflight-ops
  cancel-in-progress: false

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # The App Review demo login (demo company only); optional.
      APP_REVIEW_DEMO_EMAIL: ${{ secrets.APP_REVIEW_DEMO_EMAIL }}
      APP_REVIEW_DEMO_PASS: ${{ secrets.APP_REVIEW_DEMO_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: echo "MODE=${INPUT_MODE:-$(tr -d '[:space:]' < tools/asc-mode.txt)}" >> "$GITHUB_ENV"
      - name: Install bcryptjs (demo-reset)
        if: env.MODE == 'demo-reset'
        run: mkdir -p /tmp/bc && cd /tmp/bc && npm init -y > /dev/null && npm i --no-audit --no-fund bcryptjs@2.4.3
      - name: App Store Connect
        if: ${{ !startsWith(env.MODE, 'screens-') && env.MODE != 'walk' }}
        env:
          BCRYPT_DIR: /tmp/bc
        run: node tools/asc.mjs "$MODE"
      # A proof run or walk started right after a merge used to test the OLD
      # build. Wait until Vercel reports the newest main commit deployed (its
      # "Vercel" commit status), up to 20 minutes.
      - name: Wait for the newest main to be live
        if: env.MODE == 'screens-proof' || env.MODE == 'walk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          for i in $(seq 1 80); do
            st=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/commits/main/status" \
              | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);const v=(j.statuses||[]).find(x=>x.context==="Vercel");console.log(j.sha.slice(0,8)+" "+(v?v.state:"none"))})')
            echo "main $st"
            case "$st" in *" success") sleep 30; exit 0;; *" failure"|*" error") echo "main failed to deploy"; exit 1;; esac
            sleep 15
          done
          echo "main not live after 20 minutes"; exit 1
      # screens-capture: real screens from the live site at App Store sizes.
      - name: Install Playwright
        if: env.MODE == 'screens-capture' || env.MODE == 'screens-proof' || env.MODE == 'walk'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium webkit
      - name: Capture screenshots
        if: env.MODE == 'screens-capture'
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: node tools/asc-screens.mjs capture
      - name: Commit screenshots to this branch
        if: always() && env.MODE == 'screens-capture'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/screens
          git commit -m "App Store screenshots captured by run ${{ github.run_id }}" || exit 0
          git push origin HEAD:${{ github.ref_name }}
      # walk: tap every control on every screen of the iPhone app (WebKit) and
      # report dead buttons, errors and 404s to tools/walk/report.md. Signs in
      # to Chad's REAL company only — the E2E_* secrets when set, else the
      # company's CI user (tools/e2e-login.mjs) — never the demo company.
      # Phase 1 taps every control read-only; phase 2 does every write (create,
      # edit, send, submit, approve, delete, payments, archive, Sign Out) on
      # ZZ AUDIT test records.
      - name: Real-company login
        if: env.MODE == 'walk'
        env:
          E2E_SECRET_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_SECRET_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node tools/e2e-login.mjs
      # Run 80 stopped three screens early on "ENOSPC: no space left on device".
      # Free the toolchains this job never uses, and log the disk around the walk.
      - name: Free disk space
        if: env.MODE == 'walk'
        run: |
          df -h / /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /tmp
      - name: Walk the app
        if: env.MODE == 'walk'
        timeout-minutes: 300
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: node tools/asc-screens.mjs walk
      - name: Commit the walk report to this branch
        if: always() && env.MODE == 'walk'
        run: |
          df -h / /tmp || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/walk || exit 0
          git commit -m "App walk by run ${{ github.run_id }}" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      # screens-proof: signed-in design proof at phone + desktop, kept apart
      # from the App Store set in tools/screens.
      - name: Capture design proof
        if: env.MODE == 'screens-proof'
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: node tools/asc-screens.mjs proof
      - name: Commit design proof to this branch
        if: always() && env.MODE == 'screens-proof'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/proof
          git commit -m "Design proof captured by run ${{ github.run_id }}" || exit 0
          # A re-run checks out its original commit; earlier proof commits may
          # have moved the branch on since, so land on top of them.
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - name: Upload screenshots to App Store Connect
        if: env.MODE == 'screens-upload'
        run: node tools/asc-screens.mjs upload

name: iPhone probe

# One-off iPhone (WebKit) probes of live screens, as the real company,
# read-only. Its own concurrency group so it never waits behind the walk.
on:
  push:
    branches: [ops/testflight]
    paths: ['tools/probe-*.mjs', '.github/workflows/probe.yml']

permissions:
  contents: write

concurrency:
  group: iphone-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps webkit
      - name: Real-company login
        env:
          E2E_SECRET_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_SECRET_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: node tools/e2e-login.mjs
      - name: Probe
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: node tools/probe-menus.mjs
      - name: Commit the probe result to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe || exit 0
          git commit -m "iPhone probe result from run ${{ github.run_id }}" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}

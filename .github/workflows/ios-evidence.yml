name: iOS evidence

# Real-iOS screenshots for the redesign: the app shell's launch and sign-in in
# the iPhone simulator, then every route in tools/ios-evidence-routes.txt in
# Mobile Safari on the same simulator (same WebKit as the shell's WKWebView),
# signed in as the real company, read-only. Results are encrypted to the repo
# key and committed here; nothing readable lands in this public repo.
on:
  push:
    branches: [ops/testflight]
    paths: ['tools/ios-evidence*', '.github/workflows/ios-evidence.yml']

permissions:
  contents: write

concurrency:
  group: ios-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Real-company login
        env:
          E2E_SECRET_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_SECRET_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: node tools/e2e-login.mjs
      - name: Build the app shell for the simulator
        working-directory: app
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund > /dev/null
          mkdir -p out && echo '<!doctype html><title>Saguaro Field</title>' > out/index.html
          npx cap sync ios > /dev/null
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -n 5
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 15 \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[4-6]' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
      - name: App shell — launch and sign-in screens
        run: |
          OUT=tools/ios-evidence/shots; mkdir -p "$OUT"
          APP=$(find app/build/dd/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" net.saguarocontrol.field
          sleep 2;  xcrun simctl io "$SIM_UDID" screenshot --type=jpeg "$OUT/shell-1-launch.jpg"
          sleep 25; xcrun simctl io "$SIM_UDID" screenshot --type=jpeg "$OUT/shell-2-loaded.jpg"
          xcrun simctl terminate "$SIM_UDID" net.saguarocontrol.field || true
      - name: Mobile Safari — every route, signed in
        run: |
          # Remote Automation on the simulator's Safari (Settings > Safari > Advanced),
          # then run Safari once so WebDriver can attach to it.
          for k in RemoteAutomationEnabled WebKitRemoteAutomationEnabled; do
            xcrun simctl spawn "$SIM_UDID" defaults write com.apple.mobilesafari "$k" -bool YES || true
          done
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.WebDriver RemoteAutomationEnabled -bool YES || true
          xcrun simctl openurl "$SIM_UDID" "prefs:root=SAFARI&path=ADVANCED" || true
          sleep 4
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari || true
          xcrun simctl openurl "$SIM_UDID" "https://www.saguarocontrol.net/login" || true
          sleep 8
          xcrun simctl terminate "$SIM_UDID" com.apple.mobilesafari || true
          sudo safaridriver --enable
          safaridriver -p 4444 --diagnose > /tmp/safaridriver.log 2>&1 &
          sleep 3
          export SITE="$(tr -d '[:space:]' < tools/probe-site.txt 2>/dev/null || echo https://www.saguarocontrol.net)"
          # The repo is public: nothing about the company goes to the log.
          node tools/ios-evidence.mjs > /tmp/ios-stdout.txt 2>&1 && echo "evidence finished" || echo "evidence exited non-zero (details are in the encrypted result)"
          tail -c 4000 /tmp/safaridriver.log > tools/ios-evidence/safaridriver.txt 2>/dev/null || true
          ls -t ~/Library/Logs/com.apple.WebDriver/*.txt 2>/dev/null | head -1 | xargs -I{} tail -c 6000 {} >> tools/ios-evidence/safaridriver.txt 2>/dev/null || true
      - name: "Encrypt the result (public repo: only the key holder can read it)"
        if: always()
        run: |
          mkdir -p tools/ios-evidence && cp /tmp/ios-stdout.txt tools/ios-evidence/stdout.txt 2>/dev/null || true
          tar czf /tmp/ev.tgz -C tools ios-evidence
          rm -rf tools/ios-evidence && mkdir -p tools/ios-evidence
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/ev.tgz -out tools/ios-evidence/result.tgz.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey tools/probe-pubkey.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out tools/ios-evidence/key.enc
          rm -f /tmp/k /tmp/ev.tgz
      - name: Commit the result to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/ios-evidence || exit 0
          git commit -m "iOS evidence result from run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 10))
          done
          exit 1
